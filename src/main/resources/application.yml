spring:
  application:
    name: ddd-order

  datasource:
    # H2 内嵌数据库，数据存内存，重启清空
    url: jdbc:h2:mem:dddorder;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      # 启用 H2 控制台，浏览器访问 http://localhost:8080/h2-console 可查看数据
      enabled: true
      path: /h2-console

  jpa:
    # 启动时根据 PO 上的 @Entity 自动建表（仅学习用，生产用 Flyway/Liquibase）
    hibernate:
      ddl-auto: create-drop
    # 打印 SQL，方便学习观察实际执行语句
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
